category: Mobile
kind: os
rows:
- platform: iOS / iPadOS 12.2 and later
  native_tls13: 'Yes'
  min_release: '12.2'
  stack: Network.framework / Secure Transport
  enabled_by_default: 'Yes'
  path_to_capability: OS update; hardware older than the iOS 12 line needs replacement
  support_ends: Latest major fully supported; limited security back-support for prior majors (informal)
  extended_support: n/a
  pqc_notes: iOS 26 (fall 2025) adds the hybrid PQ group at the TLS layer in Network.framework plus quantum-secure CryptoKit APIs (corroborated; confirm shipped scope)
  caveats: App Transport Security governs app connections; MDM can pin minimum TLS
  sources: Apple
  status: High confidence
- platform: iOS 12.1 and earlier
  native_tls13: No (final RFC)
  min_release: '12.2'
  stack: Secure Transport
  enabled_by_default: 'No'
  path_to_capability: Device replacement (hardware capped below iOS 12.2)
  support_ends: Unsupported
  extended_support: n/a
  pqc_notes: None
  caveats: Survives in kiosk, scanner and payment fleets
  sources: Apple
  status: High confidence
- platform: Android 10 (API 29) and later
  native_tls13: Yes (platform default)
  min_release: Android 10
  stack: Conscrypt (BoringSSL based)
  enabled_by_default: 'Yes'
  path_to_capability: OS update where OEM provides one; otherwise device replacement
  support_ends: OEM dependent (3 to 7 years by vendor and tier)
  extended_support: n/a
  pqc_notes: From Android 10, Conscrypt is an updatable Mainline module via Google Play system updates, decoupling TLS capability from OEM firmware (corroborated; device-class coverage still to confirm)
  caveats: Fleet reality is set by the oldest OEM-abandoned devices, not the platform line
  sources: Android platform docs
  status: Needs verification
- platform: Android 9 and earlier
  native_tls13: No (platform stack)
  min_release: Android 10
  stack: Conscrypt (older)
  enabled_by_default: 'No'
  path_to_capability: Apps can self-provision TLS 1.3 via Google Play services security provider or bundled Conscrypt; the platform itself stays below the line
  support_ends: Unsupported by Google; OEM patches vary
  extended_support: n/a
  pqc_notes: None
  caveats: App-level workaround does not help system components or unmanaged apps
  sources: Android developer docs
  status: High confidence
notes:
- 'Mobile matters to infrastructure planning as the client population: once server estates enforce TLS 1.3 minimums (a prerequisite for PQC-only policies later), abandoned Android fleets and frozen iOS kiosk devices are what breaks.'
