category: macOS and BSD
kind: os
rows:
- platform: macOS 10.13 High Sierra and earlier
  native_tls13: No (draft-era code only, off by default)
  min_release: macOS 10.14.4
  stack: Secure Transport
  enabled_by_default: 'No'
  path_to_capability: OS upgrade where hardware allows; otherwise device replacement
  support_ends: Unsupported
  extended_support: n/a
  pqc_notes: None
  sources: Apple support publications
  status: High confidence
- platform: macOS 10.14 Mojave
  native_tls13: Partial before 10.14.4
  min_release: 10.14.4
  stack: Secure Transport / Network.framework
  enabled_by_default: Yes, from 10.14.4
  path_to_capability: Point update
  support_ends: Unsupported
  extended_support: n/a
  pqc_notes: None
  caveats: 10.14.4 negotiates TLS 1.3 (aligned with Safari 12.1), but App Transport Security defaults kept TLS 1.2 as the maximum in that era, so per-app behavior varied; state the claim carefully
  sources: Apple release notes
  status: Needs verification
- platform: macOS 11 Big Sur through current (macOS 26 Tahoe)
  native_tls13: 'Yes'
  min_release: Capable at GA
  stack: Network.framework / Secure Transport
  enabled_by_default: 'Yes'
  path_to_capability: Already capable
  support_ends: Apple patches roughly the three most recent majors; no formal published lifecycle
  extended_support: n/a
  pqc_notes: The 26 cycle (fall 2025) added the hybrid PQ group at the TLS layer in Network.framework plus quantum-secure CryptoKit APIs (corroborated; confirm shipped scope against Apple docs). iMessage PQ3 came earlier
  caveats: Absence of a published support lifecycle is itself a planning caveat
  sources: Apple
  status: Needs verification
- platform: OpenBSD (LibreSSL)
  native_tls13: 'Yes'
  min_release: OpenBSD 6.8 / LibreSSL 3.2.2 (client support from 3.1)
  stack: LibreSSL (libssl / libtls)
  enabled_by_default: 'Yes'
  path_to_capability: Already capable on supported releases
  support_ends: Two most recent 6-month releases supported
  extended_support: n/a
  pqc_notes: Confirm LibreSSL PQC roadmap (not yet mainline as of seeding)
  caveats: libtls API differs from OpenSSL; ports linking OpenSSL behave per OpenSSL
  sources: OpenBSD release notes
  status: High confidence
- platform: NetBSD
  native_tls13: Yes on current
  min_release: Confirm first release with OpenSSL 1.1.1 in base
  stack: OpenSSL in base
  enabled_by_default: 'Yes'
  path_to_capability: Major upgrade for old installs
  support_ends: Per release
  extended_support: n/a
  sources: NetBSD docs
  status: Needs verification
- platform: FreeBSD 11.x and earlier
  native_tls13: 'No'
  min_release: FreeBSD 12.0
  stack: Base OpenSSL predates 1.1.1
  enabled_by_default: 'No'
  path_to_capability: Major version upgrade
  support_ends: Ended
  extended_support: n/a
  pqc_notes: None
  sources: FreeBSD security pages
  status: High confidence
- platform: FreeBSD 12.0 and later
  native_tls13: 'Yes'
  min_release: '12.0'
  stack: OpenSSL 1.1.1 in base at 12.0; 3.0 in 14.x
  enabled_by_default: 'Yes'
  path_to_capability: Already capable
  support_ends: Per branch (12 ended 2023-12; 13.x winding down; 14.x current)
  extended_support: n/a
  pqc_notes: Confirm base OpenSSL version and PQC state in FreeBSD 15
  sources: FreeBSD security pages
  status: Needs verification
notes:
- 'Client-side reality check: evergreen browsers bundle their own stacks, so Chrome or Firefox on an old macOS still negotiates TLS 1.3. The gap this matrix targets is the OS-native stack that system services, MDM agents, and Apple frameworks depend on.'
