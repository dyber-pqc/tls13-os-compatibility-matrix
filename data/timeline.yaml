category: Milestone Timeline
kind: timeline
rows:
- date: 2018-09
  event: OpenSSL 1.1.1 released
  why_it_matters: TLS 1.3 arrives for the OpenSSL world; the dividing line most Linux rows reduce to
  status: High confidence
- date: '2023-09-11'
  event: OpenSSL 1.1.1 upstream EOL
  why_it_matters: Distros carrying 1.1.1 (RHEL 8, Ubuntu 20.04, Debian 11) continue their own patching; upstream fixes end
  status: High confidence
- date: '2024-06-30'
  event: RHEL 7 and CentOS 7 end; Debian 10 LTS ends
  why_it_matters: Three of the largest below-the-line server populations leave free support the same day
  status: High confidence
- date: '2024-10-31'
  event: SLES 12 general support ends
  why_it_matters: Below-the-line SUSE estates move to LTSS or migrate
  status: High confidence
- date: '2025-05-31'
  event: Ubuntu 20.04 standard support ends
  why_it_matters: A capable release, but ESM-only from here
  status: High confidence
- date: '2025-07-21'
  event: Intel Clear Linux discontinued (final build 43800)
  why_it_matters: A rolling, always-current distro exits without a successor; migration line item
  status: High confidence
- date: '2025-10-02'
  event: vSphere 7.x general support ends
  why_it_matters: Below-the-line hypervisor management planes lose support
  status: High confidence
- date: '2025-10-14'
  event: Windows 10 support ends; Exchange 2016 and 2019 end
  why_it_matters: The largest below-the-line client population goes unsupported; ESU does not add TLS 1.3
  status: High confidence
- date: '2025-12-31'
  event: HP-UX 11i v3 support ends
  why_it_matters: A permanently incapable platform exits support entirely
  status: High confidence
- date: '2026-06-10'
  event: Debian 12 regular support ends
  why_it_matters: Bookworm moves to LTS; upgrade target shifts to 13
  status: High confidence
- date: '2026-06-30'
  event: Amazon Linux 2 end of life
  why_it_matters: A very large partial-capability cloud population goes unsupported
  status: High confidence
- date: '2026-08-31'
  event: Debian 11 LTS ends
  why_it_matters: The last free support for a 1.1.1-era Debian; also embedded in countless container images
  status: High confidence
- date: '2026-09-07'
  event: OpenSSL 3.0 upstream security fixes end
  why_it_matters: The stack under Ubuntu 22.04/24.04, Debian 12, RHEL 9, AL2023 loses upstream fixes; vendors carry on alone
  status: High confidence
- date: '2026-10-13'
  event: Windows Server 2022 mainstream ends; Server 2012 and 2012 R2 final ESU
  why_it_matters: First capable Windows Server enters extended; final patches for the 2012 line
  status: High confidence
- date: '2027-01-12'
  event: Windows Server 2016 extended support ends; Windows 10 Enterprise LTSC 2021 ends
  why_it_matters: Two incapable lines exit; forcing function for migration budgets
  status: High confidence
- date: 2027-04
  event: Ubuntu 22.04 standard support ends
  why_it_matters: Capable, moves to ESM
  status: High confidence
- date: '2027-10-12'
  event: Windows 10 consumer ESU ends (extended from 2026 in June 2026)
  why_it_matters: The consumer tail of the largest incapable client population loses its last patches
  status: High confidence
- date: '2027-10-31'
  event: SLES 12 LTSS ends (LTSS Core continues to 2030)
  status: High confidence
- date: '2028-03-15'
  event: Amazon Linux 2023 end of life per the AWS support statement (trackers list 2029-06; sources conflict)
  why_it_matters: The default AWS distro generation turns over
  status: Needs verification
- date: 2028-04
  event: Ubuntu 18.04 ESM ends
  why_it_matters: Final paid patches for a huge transitional population
  status: High confidence
- date: '2028-06-30'
  event: RHEL 7 ELS ends (some trackers cite 2029-05; sources conflict)
  why_it_matters: Final paid patches for the largest below-the-line server population
  status: Needs verification
- date: '2028-06-30'
  event: Debian 12 LTS ends
  status: High confidence
- date: 2028-10
  event: Windows 10 commercial ESU final year ends
  why_it_matters: Truly the end of the Windows 10 line
  status: High confidence
- date: '2029-01-09'
  event: Windows Server 2019 extended support ends
  why_it_matters: The flagship supported-but-incapable platform finally exits; any 2019 still serving TLS in 2029 spent a decade below the line
  status: High confidence
- date: 2029-04
  event: Ubuntu 24.04 standard support ends
  status: High confidence
- date: '2029-05-31'
  event: RHEL 8 maintenance ends
  why_it_matters: Last 1.1.1-era RHEL exits standard lifecycle
  status: High confidence
- date: '2030-04-08'
  event: OpenSSL 3.5 LTS support ends
  why_it_matters: The first PQC-capable LTS completes its run; successors carry hybrids forward
  status: High confidence
- date: '2030-12-31'
  event: 'EO 14412: FIPS 140-3 validated PQC key establishment deadline (US federal, FAR flow-down)'
  why_it_matters: Every federal-touching TLS endpoint needs validated ML-KEM by here, and TLS 1.3 is its prerequisite. Contractors inherit via flow-down
  status: High confidence
- date: '2031-10-14'
  event: Windows Server 2022 extended support ends
  status: High confidence
- date: '2031-12-31'
  event: 'EO 14412: PQC digital signature deadline'
  why_it_matters: Certificate chains and signing infrastructure follow key establishment by one year
  status: High confidence
- date: '2032-01-13'
  event: Windows 10 IoT Enterprise LTSC 2021 ends
  why_it_matters: 'A platform incapable of TLS 1.3 remains vendor-supported past both federal PQC deadlines. The clearest case: lifecycle-based planning misses it, capability-based planning catches it'
  status: High confidence
- date: '2032-05-31'
  event: RHEL 9 maintenance ends
  status: High confidence
- date: ~2033
  event: CNSA 2.0 exclusivity targets (phased by category through the early 2030s)
  why_it_matters: National Security Systems complete the transition; commercial procurement gravity follows
  status: High confidence
- date: '2035-05-31'
  event: RHEL 10 maintenance ends
  why_it_matters: The first ML-KEM-native RHEL completes its lifecycle
  status: High confidence
- date: 2036-04
  event: Ubuntu 26.04 ESM ends
  why_it_matters: The first PQC-default Ubuntu LTS completes its extended run
  status: High confidence
