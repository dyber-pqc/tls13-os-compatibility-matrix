name: Add a platform
description: Something you run is missing from the matrix.
title: "[add] "
labels: [new-platform]
body:
  - type: markdown
    attributes:
      value: |
        Especially wanted: OT/ICS, storage & backup appliances, session border controllers,
        SaaS TLS floors, telecom core, NAS firmware, RTOS ecosystems, second-tier network vendors.
  - type: input
    id: platform
    attributes:
      label: Platform / component
      placeholder: Synology DSM 7.2
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Best-fit category
      description: Which data file it belongs in — or "new category"
      placeholder: Network Appliances
    validations:
      required: true
  - type: textarea
    id: claims
    attributes:
      label: What you know
      description: |
        TLS 1.3 status, minimum version, defaults, per-plane differences (appliances get one
        row per plane/feature), lifecycle dates — whatever you can support with a source.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Vendor docs, release notes, lifecycle pages a stranger can check.
    validations:
      required: true
